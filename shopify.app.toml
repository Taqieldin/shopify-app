# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "mock_shopify_api_key_dev"
name = "Digital Product Passport & Private Club"
handle = "digital-passport-private-club"
application_url = "http://localhost:3000"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = ""

[access_scopes]
scopes = "read_products,write_products,read_customers,read_orders"

[auth]
redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/shopify/callback"
]

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/api/webhooks/app-uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/updated" ]
  uri = "/api/webhooks/orders"

  [[webhooks.subscriptions]]
  topics = [ "products/update", "products/delete" ]
  uri = "/api/webhooks/products"

[pos]
embedded = false
