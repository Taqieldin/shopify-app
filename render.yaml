services:
  - type: web
    name: digital-passport-private-club
    env: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: APP_URL
        fromService:
          name: digital-passport-private-club
          type: web
          property: url
      - key: PUBLIC_APP_URL
        fromService:
          name: digital-passport-private-club
          type: web
          property: url
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
